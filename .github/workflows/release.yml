# Builds release bundles for Linux, Windows and macOS when a tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: "-- --locked"
          - platform: windows-latest
            args: "-- --locked"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin -- --locked"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin -- --locked"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The publishing path is the one that needs the gate most: a tag can be
      # pushed at any commit, and without this step a drifted lock entry or a
      # tampered codec archive would ship. `shell: bash` is explicit because the
      # Windows leg defaults to pwsh and ci.sh is a bash script.
      - name: Codec trust gate
        shell: bash
        run: ./scripts/ci.sh trust

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HEIC Image Converter ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
