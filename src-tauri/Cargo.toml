[package]
name = "heic-image-converter"
version = "0.1.0"
description = "Fast, private, offline image conversion with first-class HEIC support"
authors = ["Darticus"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/DarticusMaximus/heic-image-converter"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "heic_image_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heif-rs = "=26.10.3"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "tiff",
  "bmp",
  "gif",
] }
rayon = "1"
walkdir = "2"
base64 = "0.22"
kamadak-exif = "0.6"

# The HEIC wrapper is consumed from the vendored fork, never from crates.io: its
# build script is replaced so the codec artifact is resolved from the committed
# manifest and checksum-verified. See src-tauri/vendor/heif-rs/VENDORED.md.
[patch.crates-io]
heif-rs = { path = "vendor/heif-rs" }

# Release profile tuned for a small, fast binary. `panic = "abort"` is
# deliberately not set: a single decoder panic is caught per-file so one bad
# image can't take the whole batch (and the app) down with it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"
sha2 = "0.10"
